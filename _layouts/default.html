<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141416">
  <title>{{ page.title | escape }} · Authoria</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
  <script src="{{ '/assets/site.js' | relative_url }}" defer></script>
</head>
<body class="page-{{ page.key }}">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Authoria home">
        <img class="brand-logo" src="{{ '/assets/images/authoria-logo.png' | relative_url }}" alt="Authoria — Requiem Reforged" width="600" height="338">
      </a>
      <button class="menu-toggle" type="button" aria-controls="primary-nav" aria-expanded="false">Menu <span aria-hidden="true">☰</span></button>
      <nav id="primary-nav" class="primary-nav" aria-label="Main navigation">
        {% for item in site.data.navigation %}<a href="{{ item.url | relative_url }}" {% if page.key == item.key %}aria-current="page"{% endif %}>{{ item.title }}</a>{% endfor %}
        <a class="discord-link" href="https://discord.gg/J6VkyeXDUv">Discord <span aria-hidden="true">↗</span></a>
      </nav>
    </div>
  </header>
  {{ content }}
  <footer class="site-footer container">
    <div><a class="footer-name" href="{{ '/' | relative_url }}">Authoria <span>— Requiem Reforged</span></a><p>A Skyrim modlist. A community-built adventure.</p></div>
    <nav aria-label="Community links"><a href="https://discord.gg/J6VkyeXDUv">Discord ↗</a><a href="https://www.nexusmods.com/skyrimspecialedition/mods/170235">Nexus Mods ↗</a><a href="https://github.com/Drheisen1/Authoria-Requiem-Reforged">GitHub ↗</a></nav>
  </footer>
  <dialog class="image-viewer" aria-label="Screenshot viewer">
    <form method="dialog"><button aria-label="Close screenshot">Close <span aria-hidden="true">×</span></button></form>
    <img alt="">
    <p></p>
  </dialog>
</body>
</html>
